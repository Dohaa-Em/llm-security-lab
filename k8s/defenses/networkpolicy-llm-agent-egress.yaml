# Defense against LLM06: the agent can only send traffic to Ollama.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-agent-hardened
  namespace: llm-apps
spec:
  podSelector:
    matchLabels:
      app: llm-agent
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ollama-chatbot
    ports:
    - port: 11434
