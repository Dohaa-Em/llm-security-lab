# Defense against LLM04: only the RAG pipeline pod can reach ChromaDB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chromadb-access-control
  namespace: llm-security
spec:
  podSelector:
    matchLabels:
      app: chromadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-pipeline
      ports:
        - protocol: TCP
          port: 8000
